[profile.default]
solc_version = "0.8.26"
src = "../src/contracts"
out = "../artifacts_forge"
libs = ["lib"]
via_ir = false
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts",
    "@openzeppelin-v5/contracts/=lib/openzeppelin-contracts-v5/contracts",
    "@superfluid-finance/=lib/protocol-monorepo/packages",
]
