name: Secret Guard

on:
  push:
  pull_request:
  schedule:
    - cron: "17 * * * *" # hourly sweep
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: secret-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Catch + auto-correct: .gitignore rules and tracked env files
  env-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: check
        name: Check .gitignore and tracked env files
        run: |
          set -euo pipefail
          FIX=0
          touch .gitignore
          for p in '.env' '.env.*' '!.env.example'; do
            if ! grep -qxF -- "$p" .gitignore; then echo "$p" >> .gitignore; FIX=1; fi
          done
          TRACKED=$(git ls-files | grep -E '(^|/)\.env(\.[^/]+)?$' | grep -vE '\.env\.example$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Env files tracked in git: $TRACKED"
            printf '%s\n' "$TRACKED" | xargs git rm --cached --quiet
            FIX=1
          fi
          echo "fix=$FIX" >> "$GITHUB_OUTPUT"
          echo "tracked=$(printf '%s' "$TRACKED" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Auto-fix via pull request
        if: steps.check.outputs.fix == '1' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="security/autofix-${{ github.run_id }}"
          git config user.name "secret-guard[bot]"
          git config user.email "secret-guard@users.noreply.github.com"
          git checkout -b "$BR"
          git add .gitignore
          git commit -m "security: ignore .env files, untrack committed env files"
          git push origin "$BR"
          gh pr create --base "${{ github.ref_name }}" --head "$BR" \
            --title "🔒 Secret Guard auto-fix" \
            --body "Adds .env rules to .gitignore and untracks: \`${{ steps.check.outputs.tracked }}\`. Untracked secrets are STILL in git history. Rotate them."

      - name: Fail if env files were tracked
        if: steps.check.outputs.tracked != ''
        run: exit 1

  # 2) Catch: secret patterns in commits (default rules + custom EVM/Supabase rules)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # 3) Alert: GitHub issue (pushes to your phone/email) + optional Telegram
  alert:
    needs: [env-hygiene, secret-scan]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TG_ALERT_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TG_ALERT_CHAT_ID }}
    steps:
      - name: Open or update alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 Secret Guard: exposure detected in ${context.repo.repo}`;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run: ${run}\nRef: ${context.ref}\n\n1. Rotate every exposed key NOW (move funds/roles if a wallet key)\n2. Purge history: git filter-repo\n3. Close this issue`;
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, assignees: [context.repo.owner] });
            }

      - name: Telegram alert
        if: env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text="🚨 Secret Guard: exposure in ${{ github.repository }} (${{ github.ref_name }}) ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
